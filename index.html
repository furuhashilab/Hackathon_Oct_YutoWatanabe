<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淵野辺 ルート＆スポット探索マップ</title>
<meta name="description" content="淵野辺駅から青山学院大学相模原キャンパスまでの徒歩ルートと、周辺500m以内の飲食店・コンビニ・公園を表示するマップ">

<!--
  TomTom Maps SDK for JavaScript (@tomtom-org/maps-sdk) を CDN から ES Modules として読み込む。
  SDK は peer dependencies（maplibre-gl, @turf/turf, lodash-es, zod, culori）を
  bare specifier で import するため、import map で CDN の URL に解決する。
-->
<!-- 新SDK は MapLibre の CSS を自動で読み込むが、旧API（v1）フォールバック時は自前で読み込む -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.css">
<script type="importmap">
{
  "imports": {
    "@tomtom-org/maps-sdk/core": "https://cdn.jsdelivr.net/npm/@tomtom-org/maps-sdk@1.0.0-rc.1/core/dist/core.es.js",
    "@tomtom-org/maps-sdk/services": "https://cdn.jsdelivr.net/npm/@tomtom-org/maps-sdk@1.0.0-rc.1/services/dist/services.es.js",
    "@tomtom-org/maps-sdk/map": "https://cdn.jsdelivr.net/npm/@tomtom-org/maps-sdk@1.0.0-rc.1/map/dist/map.es.js",
    "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.mjs",
    "@turf/turf": "https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/+esm",
    "lodash-es": "https://cdn.jsdelivr.net/npm/lodash-es@4.18.1/+esm",
    "zod": "https://cdn.jsdelivr.net/npm/zod@4.6.5/+esm",
    "culori/fn": "https://cdn.jsdelivr.net/npm/culori@4.0.2/fn/+esm"
  }
}
</script>

<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7684;
    --line: #e3e7ec;
    --accent: #2563eb;
    --food: #e8590c;
    --conv: #0c8599;
    --park: #2f9e44;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }

  .layout { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-height: 320px; }

  aside {
    width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .section h2 { margin: 0 0 8px; font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }

  .route-ends { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
  .route-ends li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    color: #fff; font-size: .72rem; font-weight: 700; flex-shrink: 0;
  }
  .badge.start { background: #16a34a; }
  .badge.goal { background: #dc2626; }
  .summary { display: flex; gap: 16px; margin-top: 10px; }
  .summary div { font-size: .78rem; color: var(--muted); }
  .summary strong { display: block; font-size: 1.15rem; color: var(--text); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button {
    font: inherit; font-size: .85rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .filters button .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); }
  .filters button .count { font-size: .75rem; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
  .filters button[aria-pressed="true"] .dot { background: #fff; }
  .filters button[aria-pressed="true"] .count { color: rgba(255,255,255,.85); }
  .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .list-wrap { flex: 1; overflow-y: auto; min-height: 0; }
  #poi-list { list-style: none; margin: 0; padding: 4px 0; }
  #poi-list li {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 16px; cursor: pointer;
    border-bottom: 1px solid #f0f2f5;
  }
  #poi-list li:hover { background: #f3f6fb; }
  #poi-list .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  #poi-list .name { font-size: .9rem; }
  #poi-list .meta { font-size: .75rem; color: var(--muted); }
  .empty { padding: 16px; font-size: .85rem; color: var(--muted); }

  #status {
    font-size: .8rem; color: var(--muted);
    padding: 8px 16px; border-top: 1px solid var(--line);
  }
  #status.error { color: #c92a2a; background: #fff5f5; }

  .maplibregl-popup-content { font-family: inherit; font-size: .85rem; padding: 8px 12px; }
  .popup-title { font-weight: 700; }
  .popup-meta { color: var(--muted); font-size: .75rem; }

  @media (max-width: 760px) {
    .layout { flex-direction: column-reverse; }
    aside { width: 100%; max-height: 45vh; border-right: none; border-top: 1px solid var(--line); }
    #map { min-height: 55vh; }
  }
</style>
</head>
<body>
<header>
  <h1>淵野辺 ルート＆スポット探索マップ</h1>
  <p>淵野辺駅 → 青山学院大学 相模原キャンパス の徒歩ルートと、ルート周辺500m以内のスポット</p>
</header>

<div class="layout">
  <aside>
    <div class="section">
      <h2>徒歩ルート</h2>
      <ul class="route-ends">
        <li><span class="badge start">発</span>淵野辺駅</li>
        <li><span class="badge goal">着</span>青山学院大学 相模原キャンパス</li>
      </ul>
      <div class="summary">
        <div>距離<strong id="route-distance">–</strong></div>
        <div>所要時間（徒歩）<strong id="route-time">–</strong></div>
      </div>
    </div>

    <div class="section">
      <h2>カテゴリで絞り込み</h2>
      <div class="filters" role="group" aria-label="カテゴリ">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="food" aria-pressed="false" style="--c: var(--food)"><span class="dot"></span>飲食店<span class="count" data-count="food"></span></button>
        <button type="button" data-filter="convenience" aria-pressed="false" style="--c: var(--conv)"><span class="dot"></span>コンビニ<span class="count" data-count="convenience"></span></button>
        <button type="button" data-filter="park" aria-pressed="false" style="--c: var(--park)"><span class="dot"></span>公園<span class="count" data-count="park"></span></button>
      </div>
    </div>

    <div class="list-wrap">
      <ul id="poi-list"></ul>
    </div>
    <div id="status">読み込み中…</div>
  </aside>

  <div id="map"></div>
</div>

<script type="module">
  import { TomTomConfig } from '@tomtom-org/maps-sdk/core';
  import { calculateRoute, discoverPlaces } from '@tomtom-org/maps-sdk/services';
  import { TomTomMap, RoutingModule, PlacesModule } from '@tomtom-org/maps-sdk/map';
  import { Map as MapLibreMap, Marker, Popup, NavigationControl } from 'maplibre-gl';
  import * as turf from '@turf/turf';

  const API_KEY = 'cb1deab0-ab57-439e-9699-5b320ac07f53';

  // [経度, 緯度]（GeoJSON の順序）
  const ORIGIN = [139.3768, 35.5688];       // 淵野辺駅
  const DESTINATION = [139.3848, 35.5826];  // 青山学院大学 相模原キャンパス
  const CENTER = [(ORIGIN[0] + DESTINATION[0]) / 2, (ORIGIN[1] + DESTINATION[1]) / 2];
  const SEARCH_RADIUS_M = 500;

  // poiCategories: 新SDK（Orbis）用のカテゴリコード
  // v1Queries:     旧 Search API v2 poiSearch 用の検索語とカテゴリID（categorySet）
  const CATEGORIES = {
    food: {
      label: '飲食店', color: '#e8590c',
      poiCategories: ['RESTAURANT', 'FAST_FOOD', 'CAFE_PUB'],
      v1Queries: [{ query: 'restaurant', categorySet: '7315' }, { query: 'cafe', categorySet: '9376' }],
    },
    convenience: {
      label: 'コンビニ', color: '#0c8599',
      poiCategories: ['CONVENIENCE_STORE'],
      v1Queries: [{ query: 'convenience store', categorySet: '9361009' }],
    },
    park: {
      label: '公園', color: '#2f9e44',
      poiCategories: ['PARK_AND_RECREATION_AREA'],
      v1Queries: [{ query: 'park', categorySet: '9362' }],
    },
  };

  const statusEl = document.getElementById('status');
  const setStatus = (text, isError = false) => {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', isError);
  };

  const isAuthError = (error) => [401, 403].includes(error?.status ?? error?.response?.status);

  // ---------- 地図の初期化（Orbis → 旧API v1 ラスタタイルへフォールバック） ----------

  // 'ngt'（Neutral Ground Truth）= 各地の現地語表記。日本国内では日本語の地名・店名になる。
  TomTomConfig.instance.put({ apiKey: API_KEY, language: 'ngt' });

  const createV1Map = () => new MapLibreMap({
    container: 'map',
    center: CENTER,
    zoom: 15,
    style: {
      version: 8,
      sources: {
        'tomtom-v1': {
          type: 'raster',
          tiles: [`https://api.tomtom.com/map/1/tile/basic/main/{z}/{x}/{y}.png?key=${API_KEY}`],
          tileSize: 256,
          maxzoom: 22,
          attribution: '© <a href="https://www.tomtom.com/" target="_blank" rel="noopener">TomTom</a>',
        },
      },
      layers: [{ id: 'tomtom-v1', type: 'raster', source: 'tomtom-v1' }],
    },
  });

  // Orbis Maps が使えるかを地図の作成前に確認する。
  // （TomTomMap を作ってから v1 に作り直すと、MapLibre のワーカーが不安定になり描画が欠けることがあるため）
  const orbisAvailable = async () => {
    const url = new URL('https://api.tomtom.com/maps/orbis/assets/styles/0.6.0-0/style.json');
    url.searchParams.set('apiVersion', '1');
    url.searchParams.set('key', API_KEY);
    url.searchParams.set('map', 'basic_street-light');
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) console.warn(`Orbis Maps が利用できません（${res.status}）。旧API（v1）を使います`);
      return res.ok;
    } catch (error) {
      console.warn('Orbis Maps に接続できません。旧API（v1）を使います', error);
      return false;
    }
  };

  const createV1MapReady = () => new Promise((resolve) => {
    const ml = createV1Map();
    ml.addControl(new NavigationControl({ showCompass: false }));
    ml.once('load', () => resolve({ mode: 'v1', tomtomMap: null, ml }));
  });

  // Orbis が使えれば新SDK（TomTomMap）、使えなければ旧API v1 のラスタタイル。
  // 事前確認を通っても TomTomMap の読み込みに失敗した場合は v1 で作り直す。
  const initMap = async () => (await orbisAvailable()) ? createOrbisMap() : createV1MapReady();

  const createOrbisMap = () => new Promise((resolve) => {
    let settled = false;
    const useV1 = (reason) => {
      if (settled) return;
      settled = true;
      console.warn('Orbis Maps が利用できないため旧API（v1）に切り替えます', reason);
      try { tomtomMap?.mapLibreMap.remove(); } catch { /* 既に破棄済み */ }
      resolve(createV1MapReady());
    };

    let tomtomMap;
    try {
      tomtomMap = new TomTomMap({ mapLibre: { container: 'map', center: CENTER, zoom: 15 } });
    } catch (error) {
      useV1(error);
      return;
    }
    const ml = tomtomMap.mapLibreMap;
    // 認証エラー、またはスタイル自体が取得できない場合は v1 へ
    ml.on('error', (event) => {
      const styleFailed = /\/style/.test(event.error?.url ?? '');
      if (isAuthError(event.error) || styleFailed) useV1(event.error);
    });
    // 一定時間内に読み込みが終わらない場合も v1 へ
    const timer = setTimeout(() => useV1(new Error('Orbis Maps の読み込みがタイムアウトしました')), 10000);
    ml.once('load', () => {
      clearTimeout(timer);
      if (settled) return;
      settled = true;
      resolve({ mode: 'orbis', tomtomMap, ml });
    });
  });

  const { mode, tomtomMap, ml: mlMap } = await initMap();

  // ---------- 徒歩ルート ----------

  // 新SDK の calculateRoute（Orbis Routing API）で徒歩ルートを取得する。
  // 型定義上の TravelMode は現在 'car' のみだが、リクエスト検証は文字列を受け付けるため 'pedestrian' を渡す。
  const fetchRouteWithSdk = async () => {
    const routes = await calculateRoute({ locations: [ORIGIN, DESTINATION], travelMode: 'pedestrian' });
    const route = routes.features[0];
    return { routes, line: route.geometry, summary: route.properties.summary };
  };

  // 旧 Routing API v1（travelMode=pedestrian）
  const fetchRouteWithV1 = async () => {
    const locs = [ORIGIN, DESTINATION].map(([lng, lat]) => `${lat},${lng}`).join(':');
    const url = `https://api.tomtom.com/routing/1/calculateRoute/${locs}/json?travelMode=pedestrian&key=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw Object.assign(new Error(`Routing API v1 エラー（${res.status}）`), { status: res.status });
    const json = await res.json();
    const r = json.routes[0];
    const coordinates = r.legs.flatMap((leg) => leg.points.map((p) => [p.longitude, p.latitude]));
    return { routes: null, line: { type: 'LineString', coordinates }, summary: r.summary };
  };

  const drawRouteWithMapLibre = (line) => {
    mlMap.addSource('walk-route', { type: 'geojson', data: { type: 'Feature', geometry: line, properties: {} } });
    mlMap.addLayer({
      id: 'walk-route-casing', type: 'line', source: 'walk-route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 9 },
    });
    mlMap.addLayer({
      id: 'walk-route', type: 'line', source: 'walk-route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#2563eb', 'line-width': 5 },
    });
  };

  const addEndpointMarkers = () => {
    const ends = [
      { lngLat: ORIGIN, color: '#16a34a', label: '出発：淵野辺駅' },
      { lngLat: DESTINATION, color: '#dc2626', label: '到着：青山学院大学 相模原キャンパス' },
    ];
    for (const { lngLat, color, label } of ends) {
      new Marker({ color })
        .setLngLat(lngLat)
        .setPopup(new Popup({ offset: 30, closeButton: false }).setText(label))
        .addTo(mlMap);
    }
  };

  const showRoute = async () => {
    let result;
    let routingModule;
    if (mode === 'orbis') {
      try {
        routingModule = await RoutingModule.create(tomtomMap);
        result = await fetchRouteWithSdk();
        await routingModule.showRoutes(result.routes);
      } catch (sdkError) {
        console.warn('新SDK での徒歩ルート取得に失敗したため Routing API v1 を使います', sdkError);
        result = null;
      }
    }
    if (!result) {
      result = await fetchRouteWithV1();
      drawRouteWithMapLibre(result.line);
    }
    if (routingModule) {
      await routingModule.showWaypoints([ORIGIN, DESTINATION]);
    } else {
      addEndpointMarkers();
    }

    const { lengthInMeters, travelTimeInSeconds } = result.summary;
    document.getElementById('route-distance').textContent =
      lengthInMeters >= 1000 ? `${(lengthInMeters / 1000).toFixed(2)} km` : `${Math.round(lengthInMeters)} m`;
    document.getElementById('route-time').textContent = `約 ${Math.max(1, Math.round(travelTimeInSeconds / 60))} 分`;

    // ルート全体が収まるように表示範囲を調整
    const [minX, minY, maxX, maxY] = turf.bbox(result.line);
    mlMap.fitBounds([[minX, minY], [maxX, maxY]], { padding: 70, maxZoom: 17, duration: 800 });

    return result.line;
  };

  // ---------- ルート周辺のスポット検索 ----------

  // ルートからの距離を付与し、500m 以内だけを近い順に残す
  const withinRoute = (features, routeLine) => features
    .map((f) => ({
      ...f,
      properties: {
        ...f.properties,
        distanceFromRoute: turf.pointToLineDistance(f.geometry.coordinates, routeLine, { units: 'meters' }),
      },
    }))
    .filter((f) => f.properties.distanceFromRoute <= SEARCH_RADIUS_M)
    .sort((a, b) => a.properties.distanceFromRoute - b.properties.distanceFromRoute);

  // 新SDK：ルートの 500m バッファ内をジオメトリ検索
  const searchWithSdk = async (routeLine, buffer, key) => {
    const places = await discoverPlaces({
      geometries: [buffer.geometry],
      filters: { poiCategories: CATEGORIES[key].poiCategories },
      limit: 100,
    });
    return { type: 'FeatureCollection', features: withinRoute(places.features, routeLine) };
  };

  // 旧 Search API：poiSearch は中心点＋半径の円で検索するため、ルート沿いに円を並べて検索する
  const SAMPLE_STEP_M = 300;
  const SAMPLE_RADIUS_M = 550; // 円の間隔 300m でもルートから 500m の帯をすき間なく覆う半径

  const sampleRoutePoints = (routeLine) => {
    const length = turf.length(turf.feature(routeLine), { units: 'meters' });
    const points = [];
    for (let d = 0; d < length; d += SAMPLE_STEP_M) {
      points.push(turf.along(routeLine, d, { units: 'meters' }).geometry.coordinates);
    }
    points.push(routeLine.coordinates.at(-1));
    return points;
  };

  // 同時接続数を絞って順に実行（無料プランの QPS 制限対策）
  const runLimited = async (tasks, concurrency = 2) => {
    const results = [];
    let next = 0;
    const worker = async () => {
      while (next < tasks.length) {
        const i = next++;
        results[i] = await tasks[i]();
      }
    };
    await Promise.all(Array.from({ length: concurrency }, worker));
    return results;
  };

  const fetchV1Poi = async ({ query, categorySet }, [lng, lat], attempt = 0) => {
    const params = new URLSearchParams({
      key: API_KEY, lat, lon: lng, radius: SAMPLE_RADIUS_M, limit: 100, categorySet, language: 'NGT',
    });
    const url = `https://api.tomtom.com/search/2/poiSearch/${encodeURIComponent(query)}.json?${params}`;
    const res = await fetch(url);
    if (res.status === 429 && attempt < 3) {
      await new Promise((r) => setTimeout(r, 600 * (attempt + 1)));
      return fetchV1Poi({ query, categorySet }, [lng, lat], attempt + 1);
    }
    if (!res.ok) throw Object.assign(new Error(`Search API v2 エラー（${res.status}）`), { status: res.status });
    return (await res.json()).results ?? [];
  };

  const searchWithV1 = async (routeLine, key) => {
    const points = sampleRoutePoints(routeLine);
    const tasks = CATEGORIES[key].v1Queries.flatMap((q) => points.map((p) => () => fetchV1Poi(q, p)));
    const byId = new globalThis.Map();
    for (const r of (await runLimited(tasks)).flat()) {
      byId.set(r.id, {
        type: 'Feature',
        id: r.id,
        geometry: { type: 'Point', coordinates: [r.position.lon, r.position.lat] },
        properties: { poi: r.poi, address: r.address },
      });
    }
    return { type: 'FeatureCollection', features: withinRoute([...byId.values()], routeLine) };
  };

  // ---------- スポットの表示 ----------

  const placeName = (f) => f.properties.poi?.name ?? f.properties.address?.freeformAddress ?? '名称不明';

  // 各カテゴリの表示レイヤー（新SDK の PlacesModule か、MapLibre の円レイヤー）
  const state = { filter: 'all', layers: {}, results: {} };
  let popup;

  const openPopup = (f, key) => {
    popup?.remove();
    const el = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'popup-title';
    title.textContent = placeName(f);
    const meta = document.createElement('div');
    meta.className = 'popup-meta';
    meta.textContent = `${CATEGORIES[key].label} ・ ルートから約${Math.round(f.properties.distanceFromRoute)}m`;
    el.append(title, meta);
    if (f.properties.address?.freeformAddress) {
      const addr = document.createElement('div');
      addr.className = 'popup-meta';
      addr.textContent = f.properties.address.freeformAddress;
      el.append(addr);
    }
    popup = new Popup({ offset: 16, closeButton: true, maxWidth: '260px' })
      .setLngLat(f.geometry.coordinates)
      .setDOMContent(el)
      .addTo(mlMap);
  };

  const showWithPlacesModule = async (key, places) => {
    const module = await PlacesModule.create(tomtomMap, { markerType: 'pin', color: CATEGORIES[key].color });
    module.events.on('click', (feature) => {
      openPopup(places.features.find((f) => f.id === feature.id) ?? feature, key);
    });
    await module.show(places);
    return { setVisible: (visible) => module.setVisible(visible) };
  };

  const showWithMapLibre = (key, places) => {
    const id = `poi-${key}`;
    // MapLibre はネストしたプロパティを文字列化するため、元データへの添字だけを持たせる
    const data = {
      type: 'FeatureCollection',
      features: places.features.map((f, i) => ({ type: 'Feature', geometry: f.geometry, properties: { idx: i } })),
    };
    mlMap.addSource(id, { type: 'geojson', data });
    mlMap.addLayer({
      id, type: 'circle', source: id,
      paint: {
        'circle-radius': 7,
        'circle-color': CATEGORIES[key].color,
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 2,
      },
    });
    mlMap.on('click', id, (event) => {
      openPopup(places.features[event.features[0].properties.idx], key);
    });
    mlMap.on('mouseenter', id, () => { mlMap.getCanvas().style.cursor = 'pointer'; });
    mlMap.on('mouseleave', id, () => { mlMap.getCanvas().style.cursor = ''; });
    return { setVisible: (visible) => mlMap.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none') };
  };

  const renderList = () => {
    const list = document.getElementById('poi-list');
    list.replaceChildren();
    const keys = state.filter === 'all' ? Object.keys(CATEGORIES) : [state.filter];
    const items = keys
      .flatMap((key) => (state.results[key]?.features ?? []).map((f) => ({ f, key })))
      .sort((a, b) => a.f.properties.distanceFromRoute - b.f.properties.distanceFromRoute);

    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '該当するスポットはありません';
      list.append(li);
      return;
    }
    for (const { f, key } of items) {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = CATEGORIES[key].color;
      const body = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = placeName(f);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${CATEGORIES[key].label} ・ ルートから約${Math.round(f.properties.distanceFromRoute)}m`;
      body.append(name, meta);
      li.append(dot, body);
      li.addEventListener('click', () => {
        mlMap.flyTo({ center: f.geometry.coordinates, zoom: Math.max(mlMap.getZoom(), 16.5) });
        openPopup(f, key);
      });
      list.append(li);
    }
  };

  const applyFilter = (filter) => {
    state.filter = filter;
    document.querySelectorAll('.filters button').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.filter === filter));
    });
    for (const [key, layer] of Object.entries(state.layers)) {
      layer.setVisible(filter === 'all' || filter === key);
    }
    popup?.remove();
    renderList();
  };

  document.querySelectorAll('.filters button').forEach((btn) => {
    btn.addEventListener('click', () => {
      // 選択中のカテゴリをもう一度押すと「すべて」に戻す
      const next = btn.dataset.filter === state.filter ? 'all' : btn.dataset.filter;
      applyFilter(next);
    });
  });

  const showPlaces = async (routeLine) => {
    const buffer = turf.buffer(turf.feature(routeLine), SEARCH_RADIUS_M, { units: 'meters' });

    // 検索範囲（ルートから500m）を薄く表示
    mlMap.addSource('search-area', { type: 'geojson', data: buffer });
    mlMap.addLayer({
      id: 'search-area-fill', type: 'fill', source: 'search-area',
      paint: { 'fill-color': '#2563eb', 'fill-opacity': 0.06 },
    });
    mlMap.addLayer({
      id: 'search-area-line', type: 'line', source: 'search-area',
      paint: { 'line-color': '#2563eb', 'line-opacity': 0.35, 'line-width': 1.5, 'line-dasharray': [2, 2] },
    });

    const keys = Object.keys(CATEGORIES);
    const settled = await Promise.allSettled(keys.map(async (key) => {
      let places;
      let useSdk = mode === 'orbis';
      if (useSdk) {
        try {
          places = await searchWithSdk(routeLine, buffer, key);
        } catch (sdkError) {
          console.warn(`新SDK での検索（${CATEGORIES[key].label}）に失敗したため Search API v2 を使います`, sdkError);
          useSdk = false;
        }
      }
      if (!places) places = await searchWithV1(routeLine, key);

      state.results[key] = places;
      state.layers[key] = useSdk ? await showWithPlacesModule(key, places) : showWithMapLibre(key, places);
      document.querySelector(`[data-count="${key}"]`).textContent = places.features.length;
    }));

    const failed = settled.filter((s) => s.status === 'rejected');
    failed.forEach((s) => console.error(s.reason));
    applyFilter(state.filter);

    const total = keys.reduce((n, k) => n + (state.results[k]?.features.length ?? 0), 0);
    if (failed.length === keys.length) {
      const auth = failed.some((s) => isAuthError(s.reason));
      setStatus(auth ? 'スポットを検索できません（APIキーが無効か、Search API の権限がありません）' : 'スポットの検索に失敗しました', true);
    } else if (failed.length > 0) {
      setStatus(`スポット ${total} 件を表示中（一部カテゴリの検索に失敗しました）`, true);
    } else {
      setStatus(`ルート周辺${SEARCH_RADIUS_M}m以内のスポット ${total} 件を表示中`);
    }
  };

  // ---------- 起動 ----------

  if (mode === 'v1') {
    mlMap.on('error', (event) => {
      if (isAuthError(event.error)) {
        setStatus('地図タイルを読み込めません（APIキーが無効か、Map Display API の権限がありません）', true);
      }
    });
  }

  try {
    setStatus('徒歩ルートを計算中…');
    const routeLine = await showRoute();
    setStatus('周辺スポットを検索中…');
    await showPlaces(routeLine);
  } catch (error) {
    console.error(error);
    setStatus(isAuthError(error)
      ? 'ルートを取得できません（APIキーが無効か、Routing API の権限がありません）'
      : `読み込みに失敗しました：${error.message ?? error}`, true);
  }
</script>
</body>
</html>
